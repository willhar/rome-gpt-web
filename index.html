<!DOCTYPE html>
<html>
<head>
    <title>RomeGPT</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.17.1/ort.min.js"></script>
    <script type="module">
        import { AutoTokenizer } from "https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1";
        
        let session, tokenizer;

        function log(msg) {
            console.log(msg);
            document.getElementById("debug").innerText += msg + "\n";
        }
        async function loadModel() {
            try {
                log("Loading tokenizer...");
                await loadTokenizer()
                log(`Tokenizer loaded. Vocab size: ${Object.keys(vocab).length}`);

                log("Loading ONNX model...");
                session = await ort.InferenceSession.create("rome_gpt_quantized.onnx", {
                    executionProviders: ['wasm']
                });
                log(`Model loaded. Inputs: ${session.inputNames}, Outputs: ${session.outputNames}`);
            } catch (e) {
                log("ERROR during load: " + e.message);
                console.error(e);
            }
        }
        let vocab, reverseVocab, bpeRanks;

        async function loadTokenizer() {
            const resp = await fetch("./tokenizer.json");
            const data = await resp.json();
            vocab = data.model.vocab;  // token -> id
            reverseVocab = Object.fromEntries(Object.entries(vocab).map(([k,v]) => [v,k]));
            bpeRanks = Object.fromEntries(data.model.merges.map((m, i) => [m, i]));
            log(`Tokenizer loaded. Vocab size: ${Object.keys(vocab).length}`);
        }

        function decode(ids) {
            return ids.map(id => reverseVocab[id] || "").join("").replaceAll("Ġ", " ").trim();
        }

        async function generate() {
            try {
                const prompt = document.getElementById("prompt").value;
                log(`Generating from prompt: "${prompt}"`);

                let ids = [vocab["<s>"]];  // just start with BOS token
                log(`Starting ids: [${ids}]`);
                const vocabSize = Object.keys(vocab).length;
                for (let i = 0; i < 100; i++) {
                    try {
                        // pad to length 100 with pad token id (1)
                        const padded = new Array(100).fill(1);
                        ids.forEach((id, idx) => padded[idx] = id);
                        
                        const tensor = new ort.Tensor("int64",
                            BigInt64Array.from(padded.map(BigInt)), [1, 100]);
                        const out = await session.run({ input_ids: tensor });
                        const logits = out.logits.data;
                        const vocabSize = Object.keys(vocab).length;
                        
                        // get logits at position of last real token
                        const lastPos = ids.length - 1;
                        const lastLogits = logits.slice(lastPos * vocabSize, (lastPos + 1) * vocabSize);
                        
                        const nextId = temperature_sample(lastLogits, 0.8);
                        log(`Step ${i}: next token id = ${nextId}`);
                        if (nextId === vocab["</s>"]) {
                            log("EOS reached");
                            break;
                        }
                        ids.push(nextId);
                        if (ids.length >= 30) break;
                    } catch(e) {
                        log("Step error: " + JSON.stringify(e));
                        console.error(e);
                        break;
                    }
                }
                const decoded = tokenizer.decode(ids, { skip_special_tokens: true });
                log(`Done. Output: "${decoded}"`);
                document.getElementById("output").innerText = decoded;
            } catch (e) {
                log("ERROR during generation: " + e.message);
                console.error(e);
            }
        }

        function temperature_sample(logits, temp) {
            const scaled = Array.from(logits).map(l => l / temp);
            const maxL = Math.max(...scaled);
            const exps = scaled.map(l => Math.exp(l - maxL));
            const sum = exps.reduce((a, b) => a + b, 0);
            const probs = exps.map(p => p / sum);
            const r = Math.random();
            let cumsum = 0;
            for (let i = 0; i < probs.length; i++) {
                cumsum += probs[i];
                if (r < cumsum) return i;
            }
            return probs.length - 1;
        }

        window.generate = generate;
        loadModel();
    </script>
</head>
<body>
    <input id="prompt" type="text" placeholder="Enter prompt..." />
    <button onclick="generate()">Generate</button>
    <p id="output"></p>
    <pre id="debug" style="background:#111;color:#0f0;padding:10px;font-size:12px;max-height:300px;overflow-y:auto;"></pre>
</body>
</html>
